name: malinali
description: "French ↔ Pulaar translator (on-device MarianMT)."
publish_to: 'none'

version: 1.1.7+117

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.1
  args: ^2.7.0
  aptabase_flutter: ^0.5.0

#  device_info_plus: ^13.2.0 #^11.1.1 # constrained by aptabase_flutter 0.5.0
  package_info_plus: ^10.2.1 #^8.3.1 #^8.1.1  


  marian_flutter:
    path: ../marian_flutter
  languages_dart: ^1.0.1
  dio: ^5.8.0

  vosk_flutter:
    git:
      url: https://github.com/malinali-app/vosk-flutter
      ref: bd5f53e
  permission_handler:
    git:
      url: https://github.com/weebi-com/flutter-permission-handler/
      ref: e4029c615a6e1fcb1ddfd7c66cf6f09324de3ab3
      path: permission_handler
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.2
  record: ^7.1.1
  just_audio: ^0.9.40
  just_audio_windows_plus: ^0.5.3
  lottie: ^3.1.0
  path: ^1.9.0
  archive: ^3.6.1
  filebridge:
    path: packages/filebridge
  # Leanest maintained Flutter package that includes Opus (WhatsApp voice notes).
  # There is no pub package named "ffmpeg-kit-free"; `_audio` is the Opus-capable tier.
  ffmpeg_kit_flutter_new_audio: ^2.5.2
  # whisper.cpp. Its ffmpeg_kit_flutter_new_min dependency is overridden below:
  # that kit uses the same Android namespace as ffmpeg_kit_flutter_new_audio.
  whisper_ggml: ^2.7.1
  ffi: ^2.2.0

dependency_overrides:
  ffmpeg_kit_flutter_new_min:
    path: packages/ffmpeg_kit_flutter_new_min

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/malinali_logo.jpg
    - assets/vosk-model-small-fr-0.22.zip
    - assets/dustbin_grey.json
    - assets/fr-pul/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/malinali_logo.jpg"
  min_sdk_android: 24
  windows:
    generate: true
    image_path: "assets/malinali_logo.jpg"
  macos:
    generate: true
    image_path: "assets/malinali_logo.jpg"
  linux:
    generate: true
    image_path: "assets/malinali_logo.jpg"
  web:
    generate: true
    image_path: "assets/malinali_logo.jpg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
